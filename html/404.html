<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página no encontrada</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fafaf7">
  <!-- Rutas absolutas: esta página se muestra en cualquier dirección inexistente -->
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="no-encontrado">
    <div class="contenedor">
      <p class="no-encontrado__numero">404</p>
      <h1>Esta página no existe</h1>
      <p>Es posible que el enlace haya cambiado. Te invito a volver al inicio o solicitar tu cita directamente.</p>
      <div class="botones">
        <a href="/" class="btn btn--primario">Volver al inicio</a>
        <a href="/#reservar" class="btn btn--contorno">Reservar una cita</a>
      </div>
    </div>
  </main>
</body>
</html>
